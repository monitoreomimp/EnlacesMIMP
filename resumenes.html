<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resúmenes estadísticos regionales · MIMP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
:root{
  --red:#C8102E; --red-dk:#A50D25; --violet:#3B2E7E; --violet-2:#7A45E0; --amber:#F2A900;
  --ink:#1F2430; --ink-2:#4B5462; --ink-3:#7A8392; --line:#E3E6EB; --soft:#F3F4F7; --bg:#E9EBEF;
  --sans:'Public Sans', system-ui, Arial, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}

/* ── Barra de control ── */
.bar{position:sticky;top:0;z-index:20;background:#fff;border-top:4px solid var(--red);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.bar-brand{display:flex;align-items:center;gap:14px;margin-right:auto}
.bar-brand img{height:38px;display:block}
.bar-title{font-size:15px;font-weight:700;line-height:1.2}
.bar-sub{font-size:12px;color:var(--ink-3)}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctrl select{height:40px;min-width:220px;padding:0 12px;border:1px solid #D5DAE1;border-radius:10px;font:600 14px var(--sans);color:var(--ink);background:#fff}
.btn{height:40px;padding:0 16px;border-radius:10px;border:1px solid #D5DAE1;background:#fff;color:var(--violet);font:600 13.5px var(--sans);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--violet)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-dk)}
.btn:disabled{opacity:.5;cursor:wait}
label.btn{display:inline-flex;align-items:center}
.src-info{font-size:12.5px;color:var(--ink-2);padding:8px 28px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.src-info button{border:none;background:none;color:var(--red);font:600 12.5px var(--sans);cursor:pointer;padding:0}
@media print{.src-info{display:none!important}}
.btn:focus-visible,.ctrl select:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.status{font-size:13px;color:var(--ink-2);padding:10px 28px;background:#FFF8E5;border-bottom:1px solid #F1E2B5;display:none}
.status.show{display:block}
.status.err{background:#FDECEE;border-color:#F4C7CE;color:var(--red-dk)}
.progress{height:3px;background:var(--red);width:0;transition:width .2s}

.viewer{padding:28px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:24px;overflow-x:auto}
#offscreen{position:fixed;left:-10000px;top:0}

/* ── Página A4 ── */
.page{width:210mm;height:297mm;background:#fff;position:relative;overflow:hidden;flex-shrink:0;box-shadow:0 2px 12px rgba(20,24,40,.12);display:flex;flex-direction:column}
.page-body{flex:1;padding:9mm 11mm 6mm;display:flex;flex-direction:column;gap:5mm;min-height:0}
.band{background:var(--violet);color:#fff;text-align:center;font-size:21pt;font-weight:800;letter-spacing:.01em;padding:4mm 0;text-transform:uppercase}
.stripe{height:2.2mm;display:flex;flex-shrink:0}
.stripe i{flex:1}
.stripe i:nth-child(1){flex:6;background:var(--red)}
.stripe i:nth-child(2){background:var(--violet-2)}
.stripe i:nth-child(3){background:var(--amber)}
.stripe i:nth-child(4){background:#3FA34D}
.stripe i:nth-child(5){background:#2FA4E7}
.foot{display:flex;justify-content:space-between;font-size:7pt;color:var(--ink-3);padding:0 11mm 2.5mm}
.h2{display:inline-block;background:var(--violet);color:#fff;font-size:11pt;font-weight:700;padding:1.6mm 4mm;border-radius:1.5mm}
.note{font-size:6.8pt;color:var(--ink-3);font-style:italic;line-height:1.4}
.src{font-size:7.5pt;color:var(--ink-2)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:7mm;min-height:0}
.cols>.col{display:flex;flex-direction:column;gap:4mm;min-width:0}
.cols.divided>.col:first-child{border-right:1px solid var(--line);padding-right:7mm}

/* Portada */
.cover-top{background:var(--red);color:#fff;padding:9mm 11mm 9mm;display:flex;flex-direction:column;gap:6mm;flex:1}
.cover-logo{background:#fff;border-radius:1.5mm;padding:1.6mm 2.4mm;align-self:flex-start;display:flex}
.cover-logo img{height:12mm;display:block}
.cover-kicker{font-size:17pt;font-weight:500;margin-top:10mm;letter-spacing:.02em}
.cover-name{font-size:46pt;font-weight:800;line-height:1;letter-spacing:-.02em;margin-top:-3mm}
.cover-photo{border:2.5mm solid #fff;height:84mm;background:#fff}
.ph{width:100%;height:100%;background:#ddd center/cover no-repeat}
.cover-meta{margin-top:auto;display:flex;flex-direction:column;align-items:flex-end;gap:5mm}
.cover-org{font-size:15pt;text-align:right;line-height:1.25}
.cover-corte{background:#fff;color:var(--ink);font-size:11pt;padding:2mm 4mm;min-width:80mm;text-transform:uppercase}
.cover-bottom{padding:8mm 11mm 8mm;display:grid;grid-template-columns:1fr 1fr;gap:8mm;font-size:10pt;line-height:1.45}
.cover-bottom .lead{border-left:.6mm solid var(--red);padding-left:4mm}
.cover-bottom ul{list-style:none;display:flex;flex-direction:column;gap:2.4mm;margin-top:2.4mm}
.cover-bottom li{padding-left:5mm;position:relative}
.cover-bottom li::before{content:"";position:absolute;left:0;top:1.9mm;width:1.8mm;height:1.8mm;border-radius:50%;background:var(--ink)}

/* Autoridades */
.authority{display:grid;grid-template-columns:38mm 1fr;gap:8mm;align-items:start;padding:6mm 0;border-bottom:1px solid var(--line)}
.authority:last-child{border-bottom:none}
.auth-photo{width:38mm;height:46mm;border-radius:2mm;background:var(--soft);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:8pt}
.authority.no-photo{grid-template-columns:1fr}
.auth-role{font-size:10pt;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.02em}
.auth-name{font-size:20pt;font-weight:800;margin:1.5mm 0 4mm;line-height:1.1}
.auth-list{display:grid;grid-template-columns:auto 1fr;gap:2.2mm 6mm;font-size:10pt}
.auth-list dt{color:var(--ink-3)}
.auth-list dd{font-weight:600}

/* Perfil */
.title-c{text-align:center}
.title-c h2{font-size:17pt;color:var(--violet);font-weight:700}
.title-c p{font-size:15pt;color:var(--violet);margin-top:2mm}
.title-c b{font-weight:500}
.title-c .reg{font-size:11pt;color:var(--ink-2);margin-top:1.5mm}
.band-sub{font-size:10pt;font-weight:500;letter-spacing:.02em;margin-top:1mm;opacity:.9}
.cover-sub{font-size:14pt;font-weight:500;margin-top:-2mm}
.lvl-note{align-self:flex-start;display:inline-block;background:#FFF4D6;color:#7A5A00;font-size:7.8pt;font-weight:600;padding:1mm 2.5mm;border-radius:1mm}
.ctrl select.sm{min-width:160px}
.pop-total{font-size:17pt;color:var(--violet);margin-top:2mm}
.donuts{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm 2mm}
.donut{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.donut .ic-d{position:absolute;left:0;top:0;width:7mm;height:7mm;object-fit:contain}
.with-ic{display:grid;grid-template-columns:9mm 1fr;gap:2.5mm;align-items:start}
.with-ic>.ic{width:9mm;height:9mm;object-fit:contain}
.ic-h{width:6.5mm;height:6.5mm;object-fit:contain;vertical-align:middle;margin-right:2mm}
.donut svg{width:24mm;height:24mm}
.donut-lbl{font-size:8.5pt;font-weight:700;color:var(--violet);line-height:1.2;margin-top:1mm}
.donut-n{font-size:7.5pt;color:var(--ink-2)}
.ind-grid{display:grid;grid-template-columns:1fr 1fr;gap:4mm 5mm}
.ind b{color:var(--red);font-size:12pt}
.ind .k{font-size:13pt;font-weight:700;color:var(--red)}
.ind .lbl{font-size:9pt;font-weight:700;line-height:1.25}
.ind .row{font-size:9pt}
.prob-grid{display:grid;grid-template-columns:1fr 1fr;gap:4mm 5mm}
.prob .k{font-size:17pt;font-weight:800;color:var(--red);line-height:1.1}
.prob .lbl{font-size:8.6pt;font-weight:700;line-height:1.25;margin-top:.6mm}
.prob .nac{font-size:8.6pt;font-weight:700}
.svc-group{display:flex;flex-direction:column;gap:2.4mm}
.svc-head{font-size:10pt;border-bottom:.4mm solid var(--c,var(--amber));padding-bottom:1.4mm}
.svc-item{display:grid;grid-template-columns:11mm 1fr;align-items:center;gap:2mm}
.svc-item .n{font-size:15pt;font-weight:800;color:var(--c,var(--amber));text-align:center}
.svc-item .t{font-size:9pt;font-weight:700;line-height:1.25}
.svc-item .t.none{font-weight:400;color:var(--ink-2)}
.svc-item .t small{display:block;font-weight:400;font-size:8pt}

/* Servicios implementados */
.svc-top{display:grid;grid-template-columns:1fr auto;gap:6mm;align-items:start}
.svc-counts{text-align:right;color:var(--violet);font-size:14pt;line-height:1.6}
.svc-counts b{font-weight:800}
.map{height:100mm;display:flex;align-items:center;justify-content:center}
.map img{max-width:100%;max-height:100%;display:block}
.page-body > *{flex-shrink:0}
.page-body > .map-geo{flex:1 1 0;min-height:55mm;max-height:125mm}
.map-geo > svg{width:100%;height:100%;display:block}
.svc-counts.inline{display:flex;gap:10mm;line-height:1.2;align-self:center}
.prov-grid{display:grid;grid-template-columns:1fr 1fr;gap:2.5mm 8mm;align-content:start}
.prov{display:flex;justify-content:space-between;gap:4mm;font-size:9.5pt;border-bottom:1px solid var(--line);padding-bottom:1.6mm}
.prov span:first-child{font-weight:600}
.sym{display:inline-flex;gap:1mm;flex-wrap:wrap;justify-content:flex-end}
.sym svg{width:3.2mm;height:3.2mm}
.leg.leg-cols{grid-template-columns:5mm 1fr 5mm 1fr;font-size:8pt;margin-top:3mm}
.block h3{font-size:10.5pt;font-weight:700;margin-bottom:2mm}
.block .big{font-size:14pt;font-weight:800;color:var(--red)}
.block .big.amber{color:var(--amber)}
.block .tot{display:flex;align-items:baseline;gap:4mm;font-size:9pt;margin-bottom:2mm}
.sub{font-size:8.8pt;font-weight:700;margin:1.5mm 0 1.2mm}
.sub b{color:var(--red);font-size:11pt}
.leg{display:grid;grid-template-columns:5mm 1fr;gap:1.6mm 2.5mm;align-items:start;font-size:8.8pt;color:var(--violet);margin-left:2mm}
.leg svg{width:3.6mm;height:3.6mm;margin-top:.4mm}
.leg b{font-weight:700}
.muted{font-size:9pt;color:var(--ink-2)}
.kpi-pair{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
.kpi-pair .v{font-size:13pt;font-weight:800;color:var(--violet)}
.kpi-pair .l{font-size:8.5pt;color:var(--ink-2)}
.dirt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:7pt;line-height:1.3}
.dirt th{background:#EEEAF8;color:var(--violet);text-align:left;font-weight:700;padding:1.4mm 1.5mm;font-size:7pt}
.dirt td{padding:1.3mm 1.5mm;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.dirt tr.cat td{background:var(--violet);color:#fff;font-weight:700;font-size:8pt;padding:1.6mm 1.5mm}
.dirt tr.cat .muted{color:#D9D3F5}
.dirt tr.cat .ic-h{filter:brightness(0) invert(1)}
.dirt tr.svc td{background:var(--soft);font-weight:700;font-size:7.6pt;color:var(--ink);padding:1.4mm 1.5mm}
.dirt .sv{display:flex;gap:1.5mm;align-items:flex-start}
.dirt .sv svg{width:2.8mm;height:2.8mm;flex-shrink:0;margin-top:.3mm}
.dirt .ok{color:#2E7D32;font-weight:600}
.dirt .muted{font-size:inherit;color:var(--ink-3)}
.dirt .bad{color:var(--red);font-weight:600}
.red-h{font-size:10pt;color:var(--red);margin-bottom:2mm}
hr.sep{border:none;border-top:1px solid var(--line)}

/* UPE */
.upe-hero{display:flex;align-items:center;gap:8mm;background:var(--soft);border-radius:2mm;padding:6mm 8mm}
.upe-hero .n{font-size:40pt;font-weight:800;color:var(--violet);line-height:1}
.upe-hero p{font-size:11pt;line-height:1.4}
.bars{display:flex;flex-direction:column;gap:3mm}
.bars h3{font-size:11pt;font-weight:700;color:var(--violet)}
.bar-row{display:grid;grid-template-columns:32mm 1fr 12mm;align-items:center;gap:3mm;font-size:10pt}
.bar-track{height:6mm;background:var(--soft);border-radius:1mm;overflow:hidden}
.bar-fill{height:100%;background:var(--c,var(--violet))}
.bar-row b{text-align:right;font-size:12pt}

@media (max-width:820px){
  .bar{padding:12px 16px}
  .bar-brand .bar-sub{display:none}
  .ctrl{width:100%}
  .ctrl select{flex:1;min-width:0}
  .viewer{align-items:flex-start}
}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .bar,.status,.progress{display:none!important}
  .viewer{padding:0;gap:0;display:block}
  .page{box-shadow:none;break-after:page}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){.progress{transition:none}}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-brand">
    <img src="imagenes/logo_mimp.png" alt="Ministerio de la Mujer y Poblaciones Vulnerables">
    <div>
      <div class="bar-title">Resúmenes estadísticos regionales</div>
      <div class="bar-sub">Oficina General de Monitoreo, Evaluación de Políticas y Gestión Descentralizada</div>
    </div>
  </div>
  <div class="ctrl">
    <select id="region" aria-label="Región" disabled><option>Cargando regiones…</option></select>
    <select id="prov" class="sm" aria-label="Provincia" disabled><option>Provincia</option></select>
    <select id="dist" class="sm" aria-label="Distrito" disabled><option>Distrito</option></select>
    <button class="btn primary" id="btnPdf" disabled>Descargar PDF</button>
    <button class="btn" id="btnZip" disabled>Todas las regiones (ZIP)</button>
    <button class="btn" id="btnPrint" disabled>Imprimir</button>
  </div>
</header>
<div class="progress" id="progress"></div>
<div class="status" id="status"></div>

<main class="viewer" id="viewer"></main>
<div id="offscreen" aria-hidden="true"></div>

<script>
// ══════════════════════════════════════════════════════════════
//  CONFIGURACIÓN
//  HOJAS: enlaces TSV publicados del Google Sheet. La primera columna
//  de cada hoja debe ser la región (Departamento / Región).
//  CAMPOS: qué encabezado del Sheet alimenta cada dato del resumen.
//  Si cambias un encabezado en el Sheet, cámbialo también aquí.
// ══════════════════════════════════════════════════════════════
const BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQB5NrhOTer37V3oJCiQn043FqK5zpdzJ2LacMQVO80RyGzQFSDyc5_x_07VeLCNjO9EfN4pvKu3enw/pub?single=true&output=tsv&gid=';
const CONFIG = {
  CARPETA_IMAGENES: 'imagenes/',
  CARPETA_PORTADAS: 'Fotos Regiones/',
  CARPETA_ICONOS: 'Iconos/',
  MAPA: 'mapas/peru_distritos.json',   // límites distritales (TopoJSON con IDDIST, IDPROV, NOMBDIST, NOMBPROV)   // archivo = nombre de la región tal como está en el Sheet (ej. Apurímac.png)
  HOJAS: {
    gobernador: BASE + '353378163',
    poblacion:  BASE + '1109551559',
    servicios:  BASE + '806903940',
    indicadores: BASE + '1665840861',
    iconos:     BASE + '395452209',  // hoja Iconos: Indicador | Icono
    serv_impl:  BASE + '2038705844', // hoja Serv_impl: Ubigeo | Departamento | Provincia | Distrito | CENTRO | Modalidad | Recuento
    directorio: BASE + '1491743529'  // hoja Directorio: Ubigeo | Departamento | Provincia | Distrito | CENTRO | Modalidad | Centro de Atención | Dirección | Coordinador/a | CUENTA CON ...
  },
  CAMPOS: {
    gobernador: {
      gob_link:'Enlaces',
      gob_cargo:'Título', gob_nombre:'Nombres y Apellidos', gob_foto:'Foto', vgob_foto:'Foto2', gob_nacimiento:'Fecha de Nacimiento', gob_estudios:'Estudios',
      gob_partido:'Organización Política', gob_sent_penales:'Sentencias - Delitos', gob_sent_civiles:'Sentencias - Demandas',
      vgob_cargo:'Título2', vgob_nombre:'Nombres y Apellidos2', vgob_nacimiento:'Fecha de Nacimiento2', vgob_estudios:'Estudios2',
      vgob_partido:'Organización Política2', vgob_sent_penales:'Sentencias - Delitos2', vgob_sent_civiles:'Sentencias - Demandas2'
    },
    poblacion: {
      pob_total:'Población Censada', pob_mujer:'Mujer', pob_hombre:'Hombre', pob_discapacidad:'Poblacion con discapacidad',
      pob_0_5:'Primera Infancia', pob_6_11:'Infancia', pob_12_17:'Adolescente', pob_18_29:'Juventud', pob_30_59:'Adulto', pob_60_mas:'Adultos mayores',
      pct_mujer:'Mujer %', pct_hombre:'Hombre %', pct_discapacidad:'Discapacidad %', pct_0_5:'Prim. Infancia %', pct_6_11:'Infancia %',
      pct_12_17:'Adolescente %', pct_18_29:'Juventud %', pct_30_59:'Adulto %', pct_60_mas:'Adulto Mayor %'
    },
    // Esta hoja tiene varias filas de encabezado, por eso se indica la COLUMNA (letra)
    indicadores: {
      trab_inf_mujer:'B', trab_inf_hombre:'C', jefas_hogar:'D', analf_mujer:'E', analf_hombre:'F',
      alc_prov_m:'G', alc_prov_h:'H', alc_dist_m:'I', alc_dist_h:'J',
      violencia_mujer:'K', viol_psicologica:'L', viol_fisica:'M', viol_sexual:'N', embarazo_adol:'O',
      feminicidio:'P', nna_riesgo:'Q', am_discriminacion:'R', pcd_discriminacion:'S'
    },
    servicios: {
      periodo:'periodo',
      cem_reg_n:'CEMreg-nro', cem_reg_at:'CEMreg-atenciones', cem24_n:'CEM24-nro', cem24_at:'CEM24-atenciones', cem_total_at:'Total de atenciones',
      hrt_n:'HRT_nro', hrt_at:'hrt_atendidos', upe_n:'UPE_nro', pcd_centros:'Centros Discapacitados',
      beneficencias:'Sociedades', juguemos:'Juguemos', ponte_modo_ninez:'Estrategias', demuna:'Demuna_Nro', ciam:'CIAM_nro'
    }
  },
  // Agrupación de los servicios de la hoja Serv_impl. Un servicio entra en la
  // primera categoría que tenga alguna de sus "claves" dentro del nombre.
  // Si la hoja tiene una columna "Categoría", se usa esa columna en su lugar.
  CATEGORIAS: [
    { nombre:'En atención a la violencia', icono:'Atención a la violencia', vacio:'No hay servicios de atención a la violencia',
      claves:['centro emergencia mujer','hogares de refugio','servicio de atencion rural','servicio de atencion urgente','linea 100','chat 100'] },
    { nombre:'En niñas, niños y adolescentes', icono:'Servicios NNA', vacio:'No hay servicios para niñas, niños y adolescentes',
      claves:['unidad de proteccion especial','educadores de calle','car basico','car especializado','car de urgencia','unidad de adopcion'] },
    { nombre:'En personas con discapacidad', icono:'Servicios discapacidad', vacio:'No hay centros de personas con discapacidad',
      claves:['car pcd'] },
    { nombre:'En personas adultas mayores', icono:'Servicios adultos mayores', vacio:'No hay centros de adultos mayores',
      claves:['centro de atencion de dia','centro de atencion de noche','carpam','adultas mayores','mi60'] },
    { nombre:'En familias', icono:'Servicios familias', claves:['desarrollo integral de la familia','cedif','comunal familiar','recreacion familiar','familias igualitarias'] }
  ],
  OTROS: 'Otros servicios',
  // Atenciones (hoja Servicios, solo regional) que se muestran junto a cada servicio
  ATENCIONES: [
    { servicio:'centro emergencia mujer y familia - regular', campo:'cem_reg_at' },
    { servicio:'centro emergencia mujer y familia - 24 horas', campo:'cem24_at' },
    { servicio:'hogares de refugio temporal', campo:'hrt_at', etiqueta:'personas atendidas' }
  ],
  // Conteos que, si la celda está vacía, se leen como 0

const norm = s => (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
const slug = s => norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

const has = v => v !== undefined && v !== null && String(v).trim() !== '';

function num(v){
  if(!has(v)) return null;
  let s = String(v).replace(/[\s\u00a0%]/g,'');
  if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g,'');          // 1,234,567.8
  else if (/^-?\d{1,3}(\.\d{3})+,\d+$/.test(s)) s = s.replace(/\./g,'').replace(',','.'); // 1.234.567,8
  else if ((s.match(/\./g)||[]).length > 1) { const i = s.lastIndexOf('.'); s = s.slice(0,i).replace(/\./g,'') + s.slice(i); } // 51.619.981
  else s = s.replace(',', '.');
  const n = parseFloat(s.replace(/[^\d.-]/g,''));
  return isNaN(n) ? null : Math.round(n);
}
function fmtN(n){ return n==null ? '—' : n.toLocaleString('en-US').replace(/,/g,'\u2009'); }
function nTxt(v){ const n = num(v); return n==null ? (has(v)? esc(v) : '—') : fmtN(n); }
function fmtP(v){
  if(!has(v)) return '—';
  const s = String(v).trim().replace(',', '.');
  if (s.includes('%')) return s.replace(/\s/g,'');
  const n = parseFloat(s); if (isNaN(n)) return esc(v);
  const p = Math.abs(n) <= 1 ? n*100 : n;
  return (+p.toFixed(2)).toString() + '%';
}
function pctNum(v){ const s = String(v).replace(',','.'); const n = parseFloat(s); if (isNaN(n)) return null; return s.includes('%') || Math.abs(n) > 1 ? n : n*100; }

function parseTSV(raw){
  const lines = raw.replace(/\r\n?/g,'\n').split('\n').filter(l => l.replace(/\t/g,'').trim());
  if(!lines.length) return [];
  const head = lines[0].split('\t').map(h => norm(h));
  return lines.slice(1).map(l => {
    const c = l.split('\t'); const o = {};
    head.forEach((h,i) => { if(h) o[h] = (c[i]||'').trim().replace(/^"|"$/g,''); });

const PROXIES = [u => u, u => `https://corsproxy.io/?${encodeURIComponent(u)}`, u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`];
async function fetchText(url){
  let last;
  for (const p of PROXIES){
    try{
      const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), 9000);
      const r = await fetch(p(url), {cache:'no-store', signal:ctrl.signal}); clearTimeout(t);
      if(!r.ok) throw new Error('HTTP '+r.status);
      const txt = await r.text(); if(txt.length < 10) throw new Error('respuesta vacía');
      return txt;
    }catch(e){ last = e; }
  }
  throw last || new Error('sin respuesta');
}

function parseSheet(raw){
  const lines = raw.replace(/\r\n?/g,'\n').split('\n');
  const tsv = lines.some(l => l.includes('\t'));
  const split = l => tsv ? l.split('\t') : (l.match(/("([^"]|"")*"|[^,]*)(,|$)/g) || []).slice(0,-1).map(x => x.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"'));
  return lines.map(l => split(l).map(v => (v||'').trim()));
}
// Fila de encabezado: la primera que tenga "Departamento" o "Región"
function headerRow(rows){
  for (let i = 0; i < Math.min(rows.length, 6); i++){
    const j = rows[i].findIndex(c => ['departamento','region'].includes(norm(c)));
    if (j >= 0) return { i, reg: j };
  }
  return { i: 0, reg: 0 };
}
const colIdx = (head, ref) => /^[A-Z]{1,2}$/.test(ref) ? ref.split('').reduce((a,ch) => a*26 + ch.charCodeAt(0) - 64, 0) - 1 : head.indexOf(norm(ref));
const ubigeo = v => { const d = String(v||'').replace(/\D/g,''); return d ? d.padStart(d.length % 2 ? d.length + 1 : d.length, '0') : ''; };
// Clave de provincia y distrito: por ubigeo si existe; si no, por nombre
function terrKeys(ub, prov, dist){
  if (ub.length >= 6) return { pk: ub.slice(0,4), dk: has(dist) ? ub.slice(0,6) : '' };
  if (ub.length === 4) return { pk: ub, dk: '' };
  return { pk: tkey(prov) || (has(dist) ? '-' : ''), dk: tkey(dist) };
}

// Vista de una región, provincia o distrito: hereda los datos regionales y

function buildView(Rg, pk, dk){
  const V = Object.assign({}, Rg);
  V._region = Rg; V._tipo = 'Región'; V._nombre = Rg.region; V._local = null;
  const P = pk ? Rg._subs[pk] : null;
  if (P){
    const D = dk ? P.dists[dk] : null;
    const rec = D ? D.rec : P.rec;
    // los porcentajes regionales no sirven para otro nivel
    Object.keys(V).forEach(k => { if (k.startsWith('pct_') && !(k in rec)) delete V[k]; });
    Object.assign(V, rec);
    V._local = new Set(Object.keys(rec));
    V._tipo = D ? 'Distrito' : 'Provincia'; V._nombre = D ? D.nombre : P.nombre; V._prov = P.nombre;
    V._nDistProv = Rg._nDistOf[pk] ?? P.distOrder.length; V._pk = pk; V._dk = dk || '';
  }
  return V;
}

function servRows(R){
  if (!SERV) return null;
  const rk = tkey(R.region);
  return SERV.filter(s => s.reg === rk && (!R._pk || s.pk === R._pk) && (!R._dk || s.dk === R._dk));
}
function categoryOf(s){
  if (has(s.cat)) return s.cat;
  const n = norm(s.servicio);
  const c = CONFIG.CATEGORIAS.find(c => c.claves.some(k => n.includes(norm(k))));
  return c ? c.nombre : CONFIG.OTROS;
}
function groupServices(rows){
  const map = {}; const order = [];
  rows.forEach(s => { if (!map[s.servicio]){ map[s.servicio] = { nombre:s.servicio, n:0, cat:categoryOf(s) }; order.push(s.servicio); } map[s.servicio].n += s.n; });
  return order.map(k => map[k]);
}
const atencionDe = (R, nombre) => {
  if (isSub(R)) return null;
  const a = CONFIG.ATENCIONES.find(a => norm(nombre).includes(norm(a.servicio)));
  return a && has(R[a.campo]) ? { v:num(R[a.campo]), l:a.etiqueta || 'atenciones' } : null;
};
function pageServices(R, n){
  const rows = servRows(R);
  if (rows === null) return '';
  const list = groupServices(rows);
  const pad = x => String(x).padStart(2,'0');
  const cats = [...CONFIG.CATEGORIAS.map(c => c.nombre), CONFIG.OTROS];
  list.forEach(s => { if (!cats.includes(s.cat)) cats.push(s.cat); });
  const legend = items => `<div class="leg">${items.map(s => { const a = atencionDe(R, s.nombre);
    return `${symbolSvg(s.nombre)}<span><b>${pad(s.n)}</b> ${esc(s.nombre)}${a ? ` (${fmtN(a.v)} ${a.l})` : ''}</span>`; }).join('')}</div>`;
  const blocks = cats.map(cname => {
    const cfg = CONFIG.CATEGORIAS.find(c => c.nombre === cname) || {};
    const items = list.filter(s => s.cat === cname);
    if (!items.length && !cfg.vacio) return '';
    const ats = items.map(s => atencionDe(R, s.nombre)).filter(a => a && a.l === 'atenciones');
    const tot = ats.length ? `<div class="tot"><span class="big">${fmtN(ats.reduce((a,x)=>a+x.v,0))}</span><span>total de atenciones</span></div>` : '';
    return { w: Math.max(items.length, 1) + (tot ? 3 : 2), html: `<div class="block"><h3>${icon(cfg.icono,'ic-h')}${esc(cname)}</h3>${items.length ? tot + legend(items) : `<p class="muted">${esc(cfg.vacio)}</p>`}</div>` };
  }).filter(Boolean);
  // reparte los bloques en dos columnas de alto parecido
  const total = blocks.reduce((a,b) => a + b.w, 0); let acc = 0, cut = blocks.length;
  for (let i = 0; i < blocks.length; i++){ if (acc + blocks[i].w / 2 > total / 2){ cut = Math.max(i, 1); break; } acc += blocks[i].w; }
  const colA = blocks.slice(0, cut).map(b => b.html), colB = blocks.slice(cut).map(b => b.html);
  // el mapa se achica cuando la leyenda es larga, para que todo quepa en una página
  const lines = Math.max(blocks.slice(0,cut).reduce((a,b)=>a+b.w,0), blocks.slice(cut).reduce((a,b)=>a+b.w,0));
  const mapH = lines <= 9 ? 112 : lines <= 13 ? 100 : lines <= 17 ? 86 : lines <= 21 ? 72 : 58;
  const map = mapSvg(R);
  const lugar = R._tipo === 'Región' ? 'la región' : R._tipo === 'Provincia' ? 'la provincia' : 'el distrito';
  return `<section class="page">${band(R)}<div class="page-body">
    <div class="svc-top"><div><span class="h2">Servicios MIMP implementados${has(R.periodo)?' (*)':''}</span></div>
      <div class="svc-counts inline"><span><b>${pad(list.length)}</b> servicios MIMP</span><span><b>${pad(list.reduce((a,s)=>a+s.n,0))}</b> centros</span></div></div>
    ${map ? `<div class="map map-geo">${map}</div>` : (R._tipo === 'Región' && R._mapa ? `<div class="map" style="height:${mapH}mm"><img src="${R._mapa}" alt="Mapa de servicios en ${esc(R.region)}"></div>` : '')}
    ${R._tipo === 'Distrito' && map ? `<div class="note">El distrito aparece resaltado dentro de la provincia de ${esc(R._prov)}.</div>` : ''}
    ${isSub(R) ? `<div class="lvl-note">Cantidad de centros en ${lugar}. Las atenciones están disponibles solo a nivel regional (${esc(R.region)}).</div>` : ''}
    ${list.length ? `<div class="cols divided">
      <div class="col">${colA.join('<hr class="sep">')}</div>
      <div class="col">${colB.join('<hr class="sep">')}</div>
    </div>` : `<p class="muted">No hay servicios MIMP implementados en ${lugar}.</p>`}
    ${has(R.periodo) ? `<div class="note">(*) Corte ${esc(R.periodo)} - Fuente: ${esc(fuente('servicios'))}</div>` : ''}
  </div>${footer(R,n)}</section>`;
}

// ── Mapa de servicios (generado a partir de los límites distritales) ──
let TOPO = null, GEOMS = [], MAP_ERR = '';
const loadScript = src => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error(src)); document.head.appendChild(s); });
async function loadMap(){
  try{
    // librerías: si el CDN principal falla, se intenta con otro
    if (!window.d3) await loadScript('https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js').catch(() => {});
    if (!window.topojson) await loadScript('https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js').catch(() => {});
    if (!window.d3 || !window.topojson) throw new Error('no cargaron las librerías del mapa (d3 / topojson)');
    // archivo de límites: se prueba la ruta configurada y variantes comunes
    const file = CONFIG.MAPA.split('/').pop();
    const tries = [...new Set([CONFIG.MAPA, 'Mapas/' + file, file])];
    let lastStatus = '';
    for (const url of tries){
      try{
        const r = await fetch(url, { cache: 'no-store' });
        if (!r.ok){ lastStatus = `${url} (HTTP ${r.status})`; continue; }
        TOPO = await r.json(); break;
      }catch(e){ lastStatus = `${url} (${e.message})`; }
    }
    if (!TOPO) throw new Error('no se encontró el archivo de límites: ' + lastStatus);
    const key = Object.keys(TOPO.objects || {})[0];
    if (!key) throw new Error('el archivo de límites no tiene el formato esperado');
    GEOMS = TOPO.objects[key].geometries;
  }catch(e){ TOPO = null; MAP_ERR = e.message; console.warn('Mapa:', e); }
}
const titleCase = s => (s||'').toLowerCase().replace(/(^|[\s(-])([a-záéíóúñü])/g, (m,a,b) => a + b.toUpperCase()).replace(/\b(De|Del|La|Las|Los|Y|El)\b/g, w => w.toLowerCase()).replace(/^./, c => c.toUpperCase());
function mapSvg(R){
  if (!TOPO) return '';
  const Rg = R._region;
  const provs = new Set(R._tipo === 'Región' ? Rg._subOrder.filter(k => /^\d{4}$/.test(k)) : [R._pk]);
  const geoms = GEOMS.filter(g => provs.has(String(g.properties.IDPROV)));
  if (!geoms.length) return '';
  const W = 800, H = 470, coll = { type:'GeometryCollection', geometries: geoms };
  const fc = topojson.feature(TOPO, coll);
  const proj = d3.geoMercator().fitExtent([[12,12],[W-12,H-12]], fc);
  const path = d3.geoPath(proj);
  const byDist = {}; fc.features.forEach(f => byDist[String(f.properties.IDDIST)] = f);
  const regionView = R._tipo === 'Región';
  // fondo: distritos
  const fills = fc.features.map(f => {
    const hi = R._tipo === 'Distrito' && String(f.properties.IDDIST) === R._dk;
    return `<path d="${path(f)}" fill="${hi ? '#F4C9CF' : '#E7E9ED'}" stroke="${regionView ? '#F1F2F5' : '#FFFFFF'}" stroke-width="${regionView ? .6 : 1.2}"/>`;
  }).join('');
  const provLines = regionView ? `<path d="${path(topojson.mesh(TOPO, coll, (a,b) => a !== b && a.properties.IDPROV !== b.properties.IDPROV))}" fill="none" stroke="#FFFFFF" stroke-width="2.6"/>` : '';
  const outline = `<path d="${path(topojson.mesh(TOPO, coll, (a,b) => a === b))}" fill="none" stroke="#C3C8D0" stroke-width="1.2"/>`;
  // etiquetas: provincias (vista regional) o distritos
  const label = (x, y, txt, size) => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-family="Public Sans, Arial" font-size="${size}" font-weight="700" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">${esc(txt)}</text><text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-family="Public Sans, Arial" font-size="${size}" font-weight="700" fill="#7A8392">${esc(txt)}</text>`;
  const provCentroid = {};
  [...provs].forEach(pk => { const g = geoms.filter(x => String(x.properties.IDPROV) === pk); if (g.length) provCentroid[pk] = path.centroid(topojson.merge(TOPO, g)); });
  const rows = (SERV || []).filter(s => s.reg === tkey(Rg.region) && provs.has(s.pk) && (R._tipo !== 'Distrito' || s.dk === R._dk));
  const S = 11, GAP = 2.5;
  const sym = (sv, x, y) => symbolSvg(sv).replace('<svg ', `<svg x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${S}" height="${S}" `);
  let labels = '', marks = '';
  if (regionView){
    // vista regional: un grupo por provincia, un símbolo por tipo de servicio con su cantidad
    const byProv = {}; rows.forEach(s => { const g = byProv[s.pk] = byProv[s.pk] || {}; g[s.servicio] = (g[s.servicio] || 0) + s.n; });
    [...provs].filter(pk => provCentroid[pk]).forEach(pk => {
      const [cx, cy] = provCentroid[pk];
      const items = Object.entries(byProv[pk] || {});
      const CW = 30, RH = S + 4;
      const cols = Math.min(3, Math.max(1, Math.ceil(Math.sqrt(items.length)))), rowsN = Math.ceil(items.length / cols);
      const w = items.length ? Math.min(cols, items.length) * CW - (CW - S - 14) : 0, h = rowsN * RH;
      const x0 = cx - w / 2, y0 = cy - h / 2;
      if (items.length){
        marks += `<rect x="${(x0-4).toFixed(1)}" y="${(y0-4).toFixed(1)}" width="${(w+8).toFixed(1)}" height="${(h+4).toFixed(1)}" rx="4" fill="#FFFFFF" fill-opacity=".85"/>`;
        marks += items.map(([sv, n], i) => { const x = x0 + (i % cols) * CW, y = y0 + Math.floor(i / cols) * RH;
          return sym(sv, x, y) + `<text x="${(x + S + 2.5).toFixed(1)}" y="${(y + S - 1.5).toFixed(1)}" font-family="Public Sans, Arial" font-size="10" font-weight="700" fill="#3B2E7E">${n}</text>`; }).join('');
      }
      const g = geoms.find(x => String(x.properties.IDPROV) === pk);
      const name = (Rg._subs[pk] && Rg._subs[pk].nombre) || g.properties.NOMBPROV;
      labels += label(cx, (items.length ? y0 + h + 12 : cy + 5), titleCase(name), 13);
    });
  } else {
    labels = fc.features.map(f => { const [x,y] = path.centroid(f); const size = fc.features.length > 30 ? 8 : 10;
      const known = (Rg._subs[R._pk] || {dists:{}}).dists[String(f.properties.IDDIST)];
      return label(x, y + 14, titleCase((known && known.nombre) || f.properties.NOMBDIST), size); }).join('');
    // símbolos agrupados en el centro de cada distrito
    const groups = {}; rows.forEach(s => { const k = byDist[s.dk] ? s.dk : 'p' + s.pk; (groups[k] = groups[k] || []).push(s); });
    marks = Object.entries(groups).map(([k, list]) => {
      const c = k[0] === 'p' ? provCentroid[k.slice(1)] : path.centroid(byDist[k]); if (!c || isNaN(c[0])) return '';
      const items = list.flatMap(s => Array(Math.min(s.n, 6)).fill(s.servicio));
      const cols = Math.min(4, Math.ceil(Math.sqrt(items.length))), rowsN = Math.ceil(items.length / cols);
      const x0 = c[0] - (cols * (S + GAP) - GAP) / 2, y0 = c[1] - (rowsN * (S + GAP) - GAP) / 2;
      return items.map((sv, i) => sym(sv, x0 + (i % cols) * (S + GAP), y0 + Math.floor(i / cols) * (S + GAP))).join('');
    }).join('');
  }
  return `<svg class="geo" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de servicios">${fills}${provLines}${outline}${marks}${labels}</svg>`;
}

// ── Página 5: distribución territorial de los servicios ──
function pageDistribution(R, n){
  const rows = servRows(R); if (!rows) return '';
  const map = mapSvg(R);
  const mapHtml = map ? `<div class="map map-geo">${map}</div>`
    : (R._tipo === 'Región' && R._mapa ? `<div class="map"><img src="${R._mapa}" alt="Mapa de servicios en ${esc(R.region)}"></div>` : '');
  if (R._tipo === 'Distrito'){
    if (!map) return '';
    const provRows = (SERV || []).filter(s => s.reg === tkey(R.region) && s.pk === R._pk);
    const servs = [...new Set(provRows.map(s => s.servicio))];
    return `<section class="page">${band(R)}<div class="page-body">
      <div><span class="h2">Ubicación del distrito en la provincia de ${esc(R._prov)}</span></div>
      ${mapHtml}
      ${servs.length ? `<div class="leg leg-cols">${servs.map(s => `${symbolSvg(s)}<span>${esc(s)}</span>`).join('')}</div>` : `<p class="muted">No hay servicios MIMP implementados en la provincia.</p>`}
      <div class="note">El distrito aparece resaltado. Los símbolos muestran los servicios de toda la provincia.</div>
    </div>${footer(R,n)}</section>`;
  }
  if (!rows.length && !map) return '';
  const byProv = R._tipo === 'Región';
  const units = {}; const order = [];
  rows.forEach(s => { const k = (byProv ? s.pk : s.dk) || '-';
    const known = byProv ? R._region._subs[k] : (R._region._subs[R._pk] || {dists:{}}).dists[k];
    if (!units[k]){ units[k] = { nombre: (known && known.nombre) || (byProv ? s.prov : s.dist) || 'Sin dato', items: [] }; order.push(k); } units[k].items.push(s); });
  if (order.length < 2 && !mapHtml) return '';
  const servs = [...new Set(rows.map(s => s.servicio))];
  const sym = items => items.flatMap(s => Array(Math.min(s.n, 12)).fill(symbolSvg(s.servicio))).join('');
  return `<section class="page">${band(R)}<div class="page-body">
    <div><span class="h2">Distribución de los servicios por ${byProv ? 'provincia' : 'distrito'}</span></div>
    ${mapHtml}
    ${order.length ? `<div class="prov-grid">${order.map(k => { const u = units[k]; const tot = u.items.reduce((a,s)=>a+s.n,0);
      return `<div class="prov"><span>${esc(u.nombre)} <small class="muted">(${tot})</small></span><span class="sym">${sym(u.items)}</span></div>`; }).join('')}</div>` : ''}
    ${servs.length ? `<div class="leg leg-cols">${servs.map(s => `${symbolSvg(s)}<span>${esc(s)}</span>`).join('')}</div>` : ''}
  </div>${footer(R,n)}</section>`;
}

// ── Página 5: UPE ──
function pageUPE(R, n){
  if(!has(R.upe_total)) return '';
  const bars = (title, items, color) => {
    const list = items.filter(i => has(R[i[1]])); if(!list.length) return '';
    const max = Math.max(...list.map(i => num(R[i[1]])||0), 1);
    return `<div class="bars" style="--c:${color}"><h3>${title}</h3>${list.map(([l,k]) => { const v = num(R[k])||0;
      return `<div class="bar-row"><span>${l}</span><div class="bar-track"><div class="bar-fill" style="width:${(v/max*100).toFixed(1)}%"></div></div><b>${fmtN(v)}</b></div>`; }).join('')}</div>`;
  };
  return `<section class="page">${band(R)}<div class="page-body">
    <div><span class="h2">Unidad de Protección Especial (UPE) ${esc(R.region)}</span></div>${lvlNote(R, ['upe_total'])}
    <div class="upe-hero"><span class="n">${nTxt(R.upe_total)}</span><p>niñas, niños y adolescentes iniciaron procedimiento bajo alguna de las tipologías de violencia: sexual, física o psicológica.</p></div>
    ${bars('Tipo de procedimiento', [['Riesgo','upe_riesgo'],['Desprotección','upe_desproteccion']], 'var(--red)')}
    ${bars('Tipo de violencia, según tabla de valoración de riesgo', [['Sexual','upe_sexual'],['Física','upe_fisica'],['Psicológica','upe_psicologica']], 'var(--violet)')}
    ${bars('Grupo de edad', [['0 a 5 años','upe_0_5'],['6 a 11 años','upe_6_11'],['12 a 17 años','upe_12_17']], 'var(--amber)')}
    <div class="note">Nota: los valores por tipo de violencia no se suman porque corresponden a respuestas múltiples.</div>
    ${srcLine('upe')}
  </div>${footer(R,n)}</section>`;
}

// ── Directorio de servicios ──
function basicos(r){
  const total = r.si.length + r.no.length + r.nd.length; if (!total) return '<span class="muted">—</span>';
  if (r.si.length === total) return '<span class="ok">Cuenta con todos</span>';
  const parts = [];
  if (r.no.length) parts.push(`<span class="bad">No: ${r.no.join(', ')}</span>`);
  if (r.nd.length === total) parts.push('<span class="muted">Sin dato</span>');
  else if (r.nd.length) parts.push(`<span class="muted">Sin dato: ${r.nd.join(', ')}</span>`);
  return parts.join('<br>');
}
function pageDirectory(R, n){
  if (!DIR) return '';
  const rows = DIR.filter(s => s.reg === tkey(R.region) && (!R._pk || s.pk === R._pk) && (!R._dk || s.dk === R._dk));
  if (!rows.length) return '';
  const cats = [...CONFIG.CATEGORIAS.map(c => c.nombre), CONFIG.OTROS];
  rows.forEach(r => { r.cat = categoryOf(r); if (!cats.includes(r.cat)) cats.push(r.cat); });
  rows.sort((a,b) => cats.indexOf(a.cat) - cats.indexOf(b.cat) || a.servicio.localeCompare(b.servicio,'es') || a.prov.localeCompare(b.prov,'es') || a.dist.localeCompare(b.dist,'es') || a.nombre.localeCompare(b.nombre,'es'));
  const showUb = R._tipo !== 'Distrito';
  const ub = r => R._tipo === 'Región' ? `${esc(titleCase(r.dist))}<br><span class="muted">${esc(titleCase(r.prov))}</span>` : esc(titleCase(r.dist));
  const ncol = showUb ? 6 : 5;
  const count = f => rows.filter(f).length;
  let body = '', lastC = null, lastS = null;
  rows.forEach(r => {
    if (r.cat !== lastC){ lastC = r.cat; lastS = null; const cfg = CONFIG.CATEGORIAS.find(c => c.nombre === r.cat) || {};
      body += `<tr class="cat"><td colspan="${ncol}">${icon(cfg.icono,'ic-h')}${esc(r.cat.replace(/^En /,'').replace(/^./, c => c.toUpperCase()))} <span class="muted">(${count(x => x.cat === r.cat)})</span></td></tr>`; }
    if (r.servicio !== lastS){ lastS = r.servicio;
      body += `<tr class="svc"><td colspan="${ncol}"><span class="sv">${symbolSvg(r.servicio)}<span>${esc(r.servicio)} <span class="muted">(${count(x => x.cat === r.cat && x.servicio === r.servicio)})</span></span></span></td></tr>`; }
    body += `<tr><td><b>${esc(r.nombre)}</b></td>${showUb ? `<td>${ub(r)}</td>` : ''}<td>${esc(r.dir)}</td><td>${r.tel ? esc(r.tel) : '<span class="muted">—</span>'}</td><td>${esc(r.coord)}</td><td>${basicos(r)}</td></tr>`;
  });
  const lugar = R._tipo === 'Región' ? 'la región' : R._tipo === 'Provincia' ? 'la provincia' : 'el distrito';
  return `<section class="page dir">${band(R)}<div class="page-body">
    <div class="dir-intro"><span class="h2">Directorio de servicios</span><p class="muted" style="margin-top:2mm;font-size:8.5pt">${rows.length} centros de atención en ${lugar}. "Servicios básicos" indica si el local cuenta con teléfono, internet, luz, agua y desagüe.</p></div>
    <table class="dirt"><colgroup><col style="width:${showUb?19:22}%">${showUb ? '<col style="width:13%">' : ''}<col style="width:${showUb?27:32}%"><col style="width:${showUb?12:13}%"><col style="width:${showUb?16:18}%"><col style="width:${showUb?13:15}%"></colgroup>
      <thead><tr><th>Centro de atención</th>${showUb ? `<th>${R._tipo === 'Región' ? 'Distrito / provincia' : 'Distrito'}</th>` : ''}<th>Dirección</th><th>Teléfono</th><th>Coordinador/a</th><th>Servicios básicos</th></tr></thead>
      <tbody>${body}</tbody></table>
  </div>${footer(R,n)}</section>`;
}
// Reparte el directorio en tantas páginas como haga falta y renumera las páginas
function paginate(root){
  root.querySelectorAll('.page.dir').forEach(page => {
    const fits = p => { const b = p.querySelector('.page-body'); return b.scrollHeight <= b.clientHeight + 1; };
    if (fits(page)) return;
    const tbody = page.querySelector('tbody'); const rows = [...tbody.children]; tbody.innerHTML = '';
    const tpl = page.cloneNode(true); tpl.querySelector('.dir-intro p')?.remove();
    let cur = page, body = tbody, lastCat = null, lastSvc = null;
    const isHead = el => el && (el.classList.contains('cat') || el.classList.contains('svc'));
    rows.forEach(r => {
      if (r.classList.contains('cat')){ lastCat = r; lastSvc = null; } else if (r.classList.contains('svc')) lastSvc = r;
      body.appendChild(r);
      if (fits(cur) || body.children.length === 1) return;
      body.removeChild(r);
      // títulos que quedaron sueltos al final de la página pasan a la siguiente
      const moved = []; while (isHead(body.lastElementChild)) moved.unshift(body.removeChild(body.lastElementChild));
      const np = tpl.cloneNode(true); cur.after(np); cur = np; const nb = np.querySelector('tbody');
      const cont = el => { const c = el.cloneNode(true); c.querySelector('td').insertAdjacentHTML('beforeend', ' <span class="muted">· continuación</span>'); return c; };
      if (!isHead(r) || r.classList.contains('svc')){
        if (!moved.some(m => m.classList.contains('cat')) && lastCat) nb.appendChild(cont(lastCat));
        if (!r.classList.contains('svc') && !moved.some(m => m.classList.contains('svc')) && lastSvc) nb.appendChild(cont(lastSvc));
      }
      moved.forEach(m => nb.appendChild(m));
      nb.appendChild(r); body = nb;
    });
  });
  root.querySelectorAll('.page').forEach((p, i) => { const s = p.querySelector('.foot span:last-child'); if (s) s.textContent = i + 1; });
}

function buildPages(R){
  const out = [pageCover(R)];
  [pageAuthorities, pageProfile, pageServices, pageUPE, pageDirectory].forEach(fn => { const h = fn(R, out.length+1); if(h) out.push(h); });
  return out.join('');
}

// ── Vista ──
const curRegion = () => REGIONES.find(r => slug(r.region) === $('region').value) || REGIONES[0];
function current(){
  const Rg = curRegion(); if (!Rg) return null;
  const pk = Rg._subs[$('prov').value] ? $('prov').value : '';
  const dk = pk && Rg._subs[pk].dists[$('dist').value] ? $('dist').value : '';
  return buildView(Rg, pk, dk);
}
function fillProv(sel){
  const Rg = curRegion(); const p = $('prov');
  const subs = Rg ? Rg._subOrder : [];
  p.innerHTML = `<option value="">${subs.length ? 'Toda la región' : 'Sin datos provinciales'}</option>` + subs.map(pk => `<option value="${esc(pk)}">${esc(Rg._subs[pk].nombre)}</option>`).join('');
  p.disabled = !subs.length; p.value = sel && Rg && Rg._subs[sel] ? sel : '';
}
function fillDist(sel){
  const Rg = curRegion(); const d = $('dist'); const P = Rg && Rg._subs[$('prov').value];
  const list = P ? P.distOrder : [];
  d.innerHTML = `<option value="">${!P ? 'Distrito' : list.length ? 'Toda la provincia' : 'Sin datos distritales'}</option>` + list.map(dk => `<option value="${esc(dk)}">${esc(P.dists[dk].nombre)}</option>`).join('');
  d.disabled = !list.length; d.value = sel && P && P.dists[sel] ? sel : '';
}
async function render(){
  const R = current(); if(!R) return;
  await resolveImages(R._region); R._portada = R._region._portada; R._mapa = R._region._mapa;
  $('viewer').innerHTML = buildPages(R);
  await document.fonts.ready; paginate($('viewer'));
  history.replaceState(null,'','#'+[$('region').value, $('prov').value, $('dist').value].filter(Boolean).map(encodeURIComponent).join('/'));
}

// ── PDF ──
const fileName = R => 'Resumen_Estadistico_' + [R.region, R._prov, R._tipo==='Distrito' ? R._nombre : ''].filter(Boolean).map(s => norm(s).replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').replace(/(^|_)([a-z])/g,(m,a,b)=>a+b.toUpperCase())).join('_') + '.pdf';
function waitImages(root){
  return Promise.all([...root.querySelectorAll('img')].map(i => i.complete ? null : new Promise(r => { i.onload = i.onerror = r; })));
}
async function pagesToPdf(root){
  await document.fonts.ready; await waitImages(root);
  const { jsPDF } = window.jspdf; const pdf = new jsPDF({unit:'mm', format:'a4', compress:true});
  const pages = [...root.querySelectorAll('.page')];
  for (let i=0;i<pages.length;i++){
    const canvas = await html2canvas(pages[i], {scale:2, useCORS:true, backgroundColor:'#ffffff', logging:false});
    if(i) pdf.addPage();
    pdf.addImage(canvas.toDataURL('image/jpeg', .92), 'JPEG', 0, 0, 210, 297);
  }
  return pdf;
}
function saveBlob(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
function busy(on){ ['btnPdf','btnZip','btnPrint','region'].forEach(id => $(id).disabled = on); if (on){ $('prov').disabled = $('dist').disabled = true; } else { fillProv($('prov').value); fillDist($('dist').value); } }
function progress(p){ $('progress').style.width = p==null ? '0' : (p*100).toFixed(1)+'%'; }

async function downloadOne(){
  const R = current(); busy(true); status('Generando PDF de ' + fullName(R) + '…');
  try{ const pdf = await pagesToPdf($('viewer')); pdf.save(fileName(R)); status(''); }
  catch(e){ status('No se pudo generar el PDF: ' + e.message, true); }
  busy(false);
}
async function downloadAll(){
  busy(true); const zip = new JSZip(); const off = $('offscreen');
  try{
    for (let i=0;i<REGIONES.length;i++){
      const R = REGIONES[i]; status(`Generando ${i+1} de ${REGIONES.length}: ${R.region}…`); progress(i/REGIONES.length);
      await resolveImages(R); const V = buildView(R); V._portada = R._portada; V._mapa = R._mapa; off.innerHTML = buildPages(V); await document.fonts.ready; paginate(off);
      const pdf = await pagesToPdf(off);
      zip.file(fileName(V), pdf.output('arraybuffer'));
    }
    status('Comprimiendo archivos…'); progress(1);
    saveBlob(await zip.generateAsync({type:'blob'}), 'Resumenes_Estadisticos_Regionales.zip');
    status('');
  }catch(e){ status('No se pudo generar el ZIP: ' + e.message, true); }
  off.innerHTML = ''; progress(null); busy(false);
}

// ── Inicio ──
(async function init(){
  $('region').addEventListener('change', () => { fillProv(); fillDist(); render(); });
  $('prov').addEventListener('change', () => { fillDist(); render(); });
  $('dist').addEventListener('change', render);
  $('btnPdf').addEventListener('click', downloadOne);
  $('btnZip').addEventListener('click', downloadAll);
  $('btnPrint').addEventListener('click', () => window.print());
  status('Cargando datos del Google Sheet…');
  try{
    const [failed] = await Promise.all([loadData(), loadMap()]);
    if(!REGIONES.length) throw new Error('ninguna hoja respondió con regiones');
    const sel = $('region');
    sel.innerHTML = REGIONES.map(r => `<option value="${slug(r.region)}">${esc(r.region)}</option>`).join('');
    const [hr, hp, hd] = location.hash.slice(1).split('/').map(decodeURIComponent);
    if (REGIONES.some(r => slug(r.region)===hr)) sel.value = hr;
    busy(false); fillProv(hp); fillDist(hd); await render();
    const msgs = [];
    if (failed.length) msgs.push('No se pudo leer la hoja: ' + failed.join(', ') + '. El resumen se muestra sin esos datos.');
    if (MAP_ERR) msgs.push('Mapa: ' + MAP_ERR + '.');
    status(msgs.join(' '), msgs.length > 0);
  }catch(e){ status('No se pudieron cargar los datos del Sheet (' + e.message + '). Revisa que las hojas estén publicadas como TSV.', true); }
})();
</script>
